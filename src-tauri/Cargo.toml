[package]
name = "icecmd"
version = "0.6.12"
description = "Lightweight terminal project manager"
authors = ["iceno"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "icecmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
parking_lot = "0.12.5"
# Folder watching for the tree. The OS pushes changes (ReadDirectoryChangesW on
# Windows, FSEvents on macOS), so an idle app polls nothing.
notify = "8"
# One request, one endpoint: claude's usage reading, taken at most once every 90
# seconds and only while the window is open. Blocking and tiny on purpose — a
# full async client would pull hyper and tokio's whole stack in behind it for
# two kilobytes of JSON.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Windows voice typing enters text into the review field, never the PTY.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS dictation is asked for through AppKit's own `startDictation:` action.
# Same versions tauri already pulls in, so nothing new is compiled.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# Smaller, faster binary. A panic in one PTY must not kill other sessions.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

