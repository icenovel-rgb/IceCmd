name: release

# 버전 태그를 밀면 설치 파일을 빌드해 그 태그의 릴리스에 붙인다.
#   node scripts/bump-version.mjs 0.2.0
#   git commit -am "chore: 0.2.0" && git tag v0.2.0 && git push --follow-tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 이미 있는 태그에 대해 다시 빌드
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 프론트엔드보다 Rust 빌드가 압도적으로 오래 걸리므로 캐시가 효과가 크다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 태그와 소스의 버전이 어긋난 채로 릴리스가 나가는 것을 막는다.
      - name: 버전 일치 확인
        shell: bash
        run: node scripts/bump-version.mjs --check "${{ github.event.inputs.tag || github.ref_name }}"

      - run: npx tsc --noEmit

      # 번들러는 NSIS 툴체인을 GitHub 릴리스에서 받아 온다. 한 번 받아 두면 다시
      # 받지 않으므로, 그 다운로드가 죽는 날에도 빌드가 나간다.
      - name: NSIS 툴체인 캐시
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}

      # 그 다운로드가 리셋되면(`io: Peer disconnected`) 5분을 컴파일하고 마지막 1초에
      # 죽는다 — 우리 코드와 무관하고 잠시 뒤에는 대개 성공한다. 재시도는 컴파일이
      # 끝난 target 을 그대로 쓰므로 번들 단계만 다시 돈다.
      - name: 설치 파일 빌드
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run tauri build; then exit 0; fi
            echo "::warning::빌드 실패 (시도 ${attempt}/3) — 45초 뒤 다시 시도한다"
            sleep 45
          done
          exit 1

      - name: 릴리스에 설치 파일 첨부
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          # 버전이 붙지 않은 사본도 올린다. 그래야 사이트에서
          # releases/latest/download/IceCmd-Setup-x64.exe 로 항상 최신을 가리킬 수 있다.
          cp "$setup" IceCmd-Setup-x64.exe
          gh release create "$TAG" --title "IceCmd ${TAG#v}" --generate-notes || true
          gh release upload "$TAG" "$setup" IceCmd-Setup-x64.exe --clobber
