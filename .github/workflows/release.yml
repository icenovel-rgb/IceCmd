name: release

# 버전 태그를 밀면 설치 파일을 빌드해 그 태그의 릴리스에 붙인다.
#   node scripts/bump-version.mjs 0.2.0
#   git commit -am "chore: 0.2.0" && git tag v0.2.0 && git push --follow-tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 이미 있는 태그에 대해 다시 빌드
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 프론트엔드보다 Rust 빌드가 압도적으로 오래 걸리므로 캐시가 효과가 크다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 태그와 소스의 버전이 어긋난 채로 릴리스가 나가는 것을 막는다.
      - name: 버전 일치 확인
        shell: bash
        run: node scripts/bump-version.mjs --check "${{ github.event.inputs.tag || github.ref_name }}"

      - run: npx tsc --noEmit

      # 번들러는 NSIS 툴체인을 GitHub 릴리스에서 받아 온다. 한 번 받아 두면 다시
      # 받지 않으므로, 그 다운로드가 죽는 날에도 빌드가 나간다.
      - name: NSIS 툴체인 캐시
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}

      # 그 다운로드가 리셋되면(`io: Peer disconnected`) 5분을 컴파일하고 마지막 1초에
      # 죽는다 — 우리 코드와 무관하고 잠시 뒤에는 대개 성공한다. 재시도는 컴파일이
      # 끝난 target 을 그대로 쓰므로 번들 단계만 다시 돈다.
      - name: 설치 파일 빌드
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run tauri build; then exit 0; fi
            echo "::warning::빌드 실패 (시도 ${attempt}/3) — 45초 뒤 다시 시도한다"
            sleep 45
          done
          exit 1

      - name: 릴리스에 설치 파일 첨부
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          # 버전이 붙지 않은 사본도 올린다. 그래야 사이트에서
          # releases/latest/download/IceCmd-Setup-x64.exe 로 항상 최신을 가리킬 수 있다.
          cp "$setup" IceCmd-Setup-x64.exe
          gh release create "$TAG" --title "IceCmd ${TAG#v}" --generate-notes || true
          gh release upload "$TAG" "$setup" IceCmd-Setup-x64.exe --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 인텔 맥도 받아 가므로 두 아키텍처를 합쳐 유니버설로 낸다.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 버전 일치 확인
        run: node scripts/bump-version.mjs --check "${{ github.event.inputs.tag || github.ref_name }}"

      # 자격증명이 비어 있으면 tauri 는 조용히 서명을 건너뛴다. 그대로 두면
      # 열리지도 않는 dmg 가 릴리스에 붙으므로, 없을 때는 여기서 죽는다.
      - name: 서명·공증 자격증명 확인
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name 시크릿이 비어 있다 — 서명 없는 dmg 는 내보내지 않는다"
              exit 1
            fi
          done

      # 공증은 앱 암호 대신 App Store Connect API 키로 한다. 앱 암호는 계정
      # 2단계 인증에 묶여 있어 사람이 바뀌면 끊기고, API 키는 만료가 없다.
      # tauri 는 키를 파일로만 받으므로 시크릿을 디스크에 잠깐 푼다.
      - name: 공증 API 키 복원
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          dir=~/.appstoreconnect/private_keys
          mkdir -p "$dir"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$dir/AuthKey_$APPLE_API_KEY.p8"
          chmod 600 "$dir/AuthKey_$APPLE_API_KEY.p8"

      # tauri 가 APPLE_CERTIFICATE 를 임시 키체인에 직접 넣고, 번들을 서명한 뒤
      # 공증에 올리고 staple 까지 붙인다. 공증은 애플 서버가 하는 일이라
      # 몇 분 걸리고 가끔 그쪽 사정으로 실패한다 — 컴파일은 그대로 두고
      # 번들 단계만 다시 돈다.
      - name: 설치 파일 빌드 (서명 + 공증)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # 앞 단계가 홈 아래에 풀어 둔 키를 절대경로로 가리킨다.
          export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          for attempt in 1 2 3; do
            if npm run tauri build -- --target universal-apple-darwin; then exit 0; fi
            echo "::warning::빌드 실패 (시도 ${attempt}/3) — 45초 뒤 다시 시도한다"
            sleep 45
          done
          exit 1

      # tauri 는 .app 만 공증하고 dmg 는 서명만 하고 끝낸다. 사람이 실제로
      # 내려받아 여는 것은 dmg 이고, 티켓 없는 dmg 는 안에 든 앱이 공증돼
      # 있어도 Gatekeeper 가 막는다. dmg 는 제 몫의 cdhash 로 따로 심사받는다.
      - name: dmg 공증
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      # 공증이 실제로 붙었는지 여기서 못 박는다. staple 이 없으면 인터넷이
      # 끊긴 맥에서 열리지 않으므로, 통과하지 못하면 릴리스에 붙이지 않는다.
      - name: 공증 확인
        run: |
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$app"
          # 받는 사람이 dmg 를 더블클릭했을 때 그대로의 판정.
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

      - name: 릴리스에 설치 파일 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          # 윈도우 쪽과 같은 이유로 버전 없는 사본도 올린다.
          cp "$dmg" IceCmd-universal.dmg
          gh release create "$TAG" --title "IceCmd ${TAG#v}" --generate-notes || true
          gh release upload "$TAG" "$dmg" IceCmd-universal.dmg --clobber
